<label class="theme-control">
  <span>Theme</span>
  <select data-theme-selector aria-label="Theme">
    <option value="system">System</option>
    <option value="light">Light</option>
    <option value="dark">Dark</option>
  </select>
</label>
<div class="no-js-theme" aria-label="Theme without JavaScript">
  <span>Choose theme</span>
  {% for choice, label in (("system", "System"), ("light", "Light"), ("dark", "Dark")) %}
  {% if theme_action and theme_form_values %}
  <form method="post" action="{{ theme_action }}?theme={{ choice }}" data-no-js-theme="{{ choice }}">
    {% for name, value in theme_form_values.items() %}<input type="hidden" name="{{ name }}" value="{{ value }}">{% endfor %}
    <button class="quiet" type="submit"{% if theme == choice %} aria-current="page"{% endif %}>{{ label }}</button>
  </form>
  {% else %}
  <a href="{{ request.url.path }}?theme={{ choice }}"{% if theme == choice %} aria-current="page"{% endif %}>{{ label }}</a>
  {% endif %}
  {% endfor %}
</div>
