<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Quant Proofline</title>
  <script src="/static/theme-init.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="login-page" data-page="login">
  <main class="login-panel" data-testid="login-panel">
    <p class="eyebrow">RESEARCH ACCESS</p>
    <h1>Quant Proofline</h1>
    <p>Evidence workbench access for immutable experiments, Studies, operator catalog review, and verified reports.</p>
    {% include "_theme_selector.html" %}
    {% if auth_mode == "password" %}
    <form method="post" action="/auth/password">
      <input type="hidden" name="login_csrf" value="{{ login_csrf }}">
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
    </form>
    {% else %}
    <a class="button" href="{{ login_url }}">Continue with Microsoft</a>
    {% endif %}
  </main>
</body>
</html>
