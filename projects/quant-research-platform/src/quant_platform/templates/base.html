<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quant Research{% endblock %}</title>
  <script src="/static/theme-init.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body data-page="{% block page %}base{% endblock %}">
  <header class="shell-header">
    <a class="wordmark" href="/">Quant Research</a>
    <nav aria-label="Primary" data-testid="primary-nav">
      <a href="/">Overview</a>
      <a href="/operators">Operators</a>
      <a href="/templates/single_stock_daily_causal/1">Template</a>
      <a href="/experiments/new">New experiment</a>
      <a href="/history">History</a>
    </nav>
    {% include "_theme_selector.html" %}
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="quiet" type="submit">Log out</button>
    </form>
  </header>
  <main class="shell" data-testid="main-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
