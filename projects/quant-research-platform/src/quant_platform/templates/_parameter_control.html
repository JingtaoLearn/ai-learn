{% macro parameter_control(field_name, value, schema, data_kind, parameter_name) -%}
{% if schema.enum %}
<select name="{{ field_name }}"{% if not schema.nullable %} required{% endif %} data-{{ data_kind }}="{{ parameter_name }}" data-parameter-type="{{ schema.type }}" data-parameter-enum="true" data-nullable="{{ 'true' if schema.nullable else 'false' }}">
  {% if schema.nullable and none not in schema.enum %}<option value="{{ none|canonical_json }}"{% if value is none %} selected{% endif %}>{{ none|canonical_json }}</option>{% endif %}
  {% for choice in schema.enum %}
  <option value="{{ choice|canonical_json }}"{% if choice == value %} selected{% endif %}>{{ choice|canonical_json }}</option>
  {% endfor %}
</select>
{% elif schema.type == "boolean" %}
<select name="{{ field_name }}"{% if not schema.nullable %} required{% endif %} data-{{ data_kind }}="{{ parameter_name }}" data-parameter-type="boolean" data-nullable="{{ 'true' if schema.nullable else 'false' }}">
  {% if schema.nullable %}<option value=""{% if value is none %} selected{% endif %}>None</option>{% endif %}
  <option value="true"{% if value is sameas true %} selected{% endif %}>True</option>
  <option value="false"{% if value is sameas false %} selected{% endif %}>False</option>
</select>
{% elif schema.type in ("integer", "number") %}
<input name="{{ field_name }}" type="number" step="{{ '1' if schema.type == 'integer' else 'any' }}" value="{{ value if value is not none else '' }}"{% if not schema.nullable %} required{% endif %} data-{{ data_kind }}="{{ parameter_name }}" data-parameter-type="{{ schema.type }}" data-nullable="{{ 'true' if schema.nullable else 'false' }}"{% if schema.minimum is defined %} min="{{ schema.minimum }}"{% endif %}{% if schema.maximum is defined %} max="{{ schema.maximum }}"{% endif %}>
{% else %}
<input name="{{ field_name }}" type="text" value="{{ value if value is not none else '' }}"{% if not schema.nullable %} required{% endif %} data-{{ data_kind }}="{{ parameter_name }}" data-parameter-type="{{ schema.type }}" data-nullable="{{ 'true' if schema.nullable else 'false' }}">
{% endif %}
{%- endmacro %}
