# Serving app on zhlearn. Host networking so it can reach the training worker
# through the loopback SSH tunnel (127.0.0.1:18095); bound to loopback only.
services:
  quant:
    build: {context: ., network: host}
    image: quant-signal:latest
    container_name: quant-signal
    network_mode: host
    command: ["uvicorn", "quant.app:app", "--host", "127.0.0.1", "--port", "${QUANT_PORT:-18090}",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: .env
    environment:
      QUANT_DB: /data/quant.db
    volumes:
      - quant-data:/data
    restart: unless-stopped
    mem_limit: 768m
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}

volumes:
  quant-data:
