worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  client_max_body_size 16k;

  upstream production_api { server production-api:8090; }
  upstream platform_ui { server platform-ui:8090; }

  map "$http_cookie|$http_authorization|$http_x_csrf_token" $forbidden_request_header {
    default 1;
    "||" 0;
  }

  server {
    listen 8080;
    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://platform_ui;
    }
  }

  server {
    listen 9443 ssl;
    ssl_protocols TLSv1.3;
    ssl_certificate /run/secrets/tls/api.crt;
    ssl_certificate_key /run/secrets/tls/api.key;
    ssl_client_certificate /run/secrets/tls/client-ca.crt;
    ssl_verify_client on;
    location /api/v1/production/ {
      if ($forbidden_request_header) { return 403; }
      proxy_set_header X-QuantResearch-Verified-Client "";
      proxy_set_header X-QuantResearch-Verified-Client $ssl_client_s_dn;
      proxy_pass http://production_api;
      proxy_request_buffering on;
      proxy_buffering on;
    }
    location /api/v1/datasets/ {
      if ($forbidden_request_header) { return 403; }
      proxy_set_header X-QuantResearch-Verified-Client "";
      proxy_set_header X-QuantResearch-Verified-Client $ssl_client_s_dn;
      proxy_pass http://production_api;
      proxy_request_buffering on;
      proxy_buffering on;
    }
    location /api/v1/studies/ {
      if ($forbidden_request_header) { return 403; }
      proxy_set_header X-QuantResearch-Verified-Client "";
      proxy_set_header X-QuantResearch-Verified-Client $ssl_client_s_dn;
      proxy_pass http://production_api;
      proxy_request_buffering on;
      proxy_buffering on;
    }
    location / { return 404; }
  }
}
