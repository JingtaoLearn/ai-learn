worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  client_max_body_size 16k;

  upstream production_api { server production-api:8090; }

  server {
    listen 8080;
    location = /8991e9a8-1caa-41f5-b76b-6368259db5b4.html {
      root /srv/reports;
      try_files /8991e9a8-1caa-41f5-b76b-6368259db5b4.html =404;
    }
    location = /f642b386-74c0-4e9f-92e6-563e7c6a5d69.html {
      root /srv/reports;
      try_files /f642b386-74c0-4e9f-92e6-563e7c6a5d69.html =404;
    }
    location / { return 404; }
  }

  server {
    listen 8443 ssl;
    ssl_protocols TLSv1.3;
    ssl_certificate /run/secrets/tls/public.crt;
    ssl_certificate_key /run/secrets/tls/public.key;
    location = /8991e9a8-1caa-41f5-b76b-6368259db5b4.html { root /srv/reports; }
    location = /f642b386-74c0-4e9f-92e6-563e7c6a5d69.html { root /srv/reports; }
    location / { return 404; }
  }

  server {
    listen 9443 ssl;
    ssl_protocols TLSv1.3;
    ssl_certificate /run/secrets/tls/api.crt;
    ssl_certificate_key /run/secrets/tls/api.key;
    ssl_client_certificate /run/secrets/tls/client-ca.crt;
    ssl_verify_client on;
    location /api/v1/production/ {
      proxy_set_header X-QuantResearch-Verified-Client "";
      proxy_set_header X-QuantResearch-Verified-Client $ssl_client_s_dn;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_pass http://production_api;
      proxy_request_buffering on;
      proxy_buffering on;
    }
    location / { return 404; }
  }
}
