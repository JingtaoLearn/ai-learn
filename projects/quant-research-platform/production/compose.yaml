name: quantresearch-production
services:
  postgres:
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    pull_policy: never
    restart: on-failure:5
    environment:
      POSTGRES_DB: quantresearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: /etc/quantresearch-production/secrets/postgres-superuser
        target: /run/secrets/postgres-superuser
        read_only: true
        bind: {create_host_path: false}
    expose: ["5432"]
    networks: [api_internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d quantresearch"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}

  schema-migrate:
    image: ${PRODUCTION_API_IMAGE:?set reviewed digest-only production API image}
    pull_policy: never
    entrypoint: ["python", "-m", "quant_platform.full_persistence", "migrate"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    environment:
      QUANT_POSTGRES_MIGRATION_HOST: postgres
      QUANT_POSTGRES_MIGRATION_DATABASE: quantresearch
      QUANT_POSTGRES_MIGRATION_USER: postgres
      QUANT_POSTGRES_MIGRATION_PASSWORD_FILE: /run/secrets/postgres-superuser
      QUANT_POSTGRES_HOST: postgres
      QUANT_POSTGRES_DATABASE: quantresearch
      QUANT_POSTGRES_USER: qr_runtime
      QUANT_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-runtime
      MPLCONFIGDIR: /tmp/matplotlib
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - type: bind
        source: /etc/quantresearch-production/secrets/postgres-superuser
        target: /run/secrets/postgres-superuser
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/quantresearch-production/secrets/postgres-runtime
        target: /run/secrets/postgres-runtime
        read_only: true
        bind: {create_host_path: false}
    networks: [api_internal]
    depends_on:
      postgres: {condition: service_healthy}

  production-api:
    image: ${PRODUCTION_API_IMAGE:?set reviewed digest-only production API image}
    pull_policy: never
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 1.50
    mem_limit: 2048m
    memswap_limit: 2048m
    restart: on-failure:5
    stop_grace_period: 120s
    environment:
      HTTPS_PROXY: http://provider-egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost,report-edge
      MPLCONFIGDIR: /tmp/matplotlib
      QR_PRODUCTION_STATE_ROOT: /run/quantresearch/state
      QR_PRODUCTION_RELEASE_MANIFEST: /etc/quantresearch/authorities/release.json
      QR_PRODUCTION_AUTHORITIES_ROOT: /etc/quantresearch/authorities
      QR_VERIFIED_CLIENT_IDENTITY: ${QR_VERIFIED_CLIENT_IDENTITY:?set reviewed certificate subject}
      QUANT_POSTGRES_HOST: postgres
      QUANT_POSTGRES_DATABASE: quantresearch
      QUANT_POSTGRES_USER: qr_runtime
      QUANT_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-runtime
      QUANT_RESIDUAL_ROOT: /var/lib/quantresearch/residual
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run/quantresearch:size=16m,mode=0700,uid=10001,gid=10001
    volumes:
      - type: bind
        source: /var/lib/quantresearch-production/residual
        target: /var/lib/quantresearch/residual
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /var/lib/quantresearch-production/runtime-residual
        target: /var/lib/quantresearch/residual/runtime
        read_only: false
        bind: {create_host_path: false}
      - type: bind
        source: /etc/quantresearch-production/authorities
        target: /etc/quantresearch/authorities
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/quantresearch-production/secrets/provider
        target: /run/secrets/provider
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/quantresearch-production/secrets/postgres-runtime
        target: /run/secrets/postgres-runtime
        read_only: true
        bind: {create_host_path: false}
    expose: ["8090"]
    networks: [api_internal, provider_proxy_internal]
    depends_on:
      schema-migrate: {condition: service_completed_successfully}
      provider-egress-proxy: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: {driver: local, options: {max-size: 20m, max-file: "5"}}

  platform-ui:
    image: ${PRODUCTION_API_IMAGE:?set reviewed digest-only production API image}
    pull_policy: never
    entrypoint: ["python", "-m", "quant_platform.web"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: 1.00
    mem_limit: 1536m
    memswap_limit: 1536m
    restart: on-failure:5
    stop_grace_period: 120s
    env_file: /etc/quantresearch-production/secrets/ui.env
    environment:
      QUANT_STATE_ROOT: /run/quantresearch/state
      QUANT_PROJECT_ROOT: /opt/project
      QUANT_ALLOWED_EMAILS_FILE: /run/secrets/ui/allowed-emails.txt
      QUANT_BIND_HOST: 0.0.0.0
      QUANT_FORWARDED_ALLOW_IPS: "*"
      QUANT_RUNNER_IMAGE: ${PRODUCTION_API_IMAGE:?set reviewed digest-only production API image}
      QUANT_POSTGRES_HOST: postgres
      QUANT_POSTGRES_DATABASE: quantresearch
      QUANT_POSTGRES_USER: qr_runtime
      QUANT_POSTGRES_PASSWORD_FILE: /run/secrets/postgres-runtime
      MPLCONFIGDIR: /tmp/matplotlib
      QUANT_RESIDUAL_ROOT: /var/lib/quantresearch/residual
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run/quantresearch:size=128m,mode=0700,uid=10001,gid=10001
    volumes:
      - type: bind
        source: /var/lib/quantresearch-production/residual
        target: /var/lib/quantresearch/residual
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /var/lib/quantresearch-production/runtime-residual
        target: /var/lib/quantresearch/residual/runtime
        read_only: false
        bind: {create_host_path: false}
      - type: bind
        source: /etc/quantresearch-production/secrets/ui/allowed-emails.txt
        target: /run/secrets/ui/allowed-emails.txt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/quantresearch-production/secrets/postgres-runtime
        target: /run/secrets/postgres-runtime
        read_only: true
        bind: {create_host_path: false}
    expose: ["8090"]
    networks: [api_internal]
    depends_on:
      schema-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8090/health', headers={'Host':'quant.ai.jingtao.fun'}), timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: {driver: local, options: {max-size: 20m, max-file: "5"}}

  report-edge:
    image: ${REPORT_EDGE_IMAGE:?set reviewed digest-only nginx image}
    pull_policy: never
    user: "10101:10101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
    stop_grace_period: 30s
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0750,uid=10101,gid=10101
      - /var/run:size=8m,mode=0750,uid=10101,gid=10101
    volumes:
      - type: bind
        source: /etc/quantresearch-production/nginx
        target: /etc/nginx
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/quantresearch-production/tls
        target: /run/secrets/tls
        read_only: true
        bind: {create_host_path: false}
    ports: ["127.0.0.1:18090:8080", "127.0.0.1:8443:9443"]
    networks: [api_internal]
    depends_on:
      production-api: {condition: service_healthy}
      platform-ui: {condition: service_healthy}
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: {driver: local, options: {max-size: 10m, max-file: "5"}}

  provider-egress-proxy:
    image: ${PROVIDER_PROXY_IMAGE:?set reviewed digest-only provider proxy image}
    pull_policy: never
    user: "10201:10201"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    restart: on-failure:5
    stop_grace_period: 30s
    tmpfs: ["/tmp:size=16m,mode=1770,uid=10201,gid=10201"]
    volumes:
      - type: bind
        source: /etc/quantresearch-production/egress-proxy
        target: /etc/quantresearch-egress-proxy
        read_only: true
        bind: {create_host_path: false}
    expose: ["3128"]
    networks: [provider_proxy_internal, provider_egress]
    healthcheck:
      test: [CMD, python, -c, "import json; assert json.load(open('/etc/quantresearch-egress-proxy/config.json'))['methods']==['CONNECT']"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging: {driver: local, options: {max-size: 10m, max-file: "5"}}

networks:
  api_internal: {driver: bridge, internal: true, attachable: false}
  provider_proxy_internal: {driver: bridge, internal: true, attachable: false}
  provider_egress: {driver: bridge, internal: false, attachable: false}

volumes:
  postgres_data:
