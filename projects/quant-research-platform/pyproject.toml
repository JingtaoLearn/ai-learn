[project]
name = "quant-signal"
version = "2.0.0"
description = "Trend-following buy/sell signals with backtest, walk-forward optimization and Feishu alerts"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["quant"]

[tool.setuptools.package-data]
quant = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
