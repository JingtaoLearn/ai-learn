[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-quant-research"
version = "0.1.0"
description = "Reproducible gold strategy research vertical slice"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas==2.3.1", "numpy==2.3.2", "pyarrow==21.0.0",
  "exchange-calendars==4.13.2",
  "requests==2.32.4", "matplotlib==3.10.5", "mlflow==3.15.1",
  "prefect==3.8.2", "optuna==4.9.0",
  "jupyterlab==4.6.3", "jupyter-server-proxy==4.4.0",
  "fastapi==0.141.1", "jinja2==3.1.6", "uvicorn==0.52.3",
  "markdown==3.10.3", "bleach==6.4.0"
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.8"]

[project.scripts]
gold-research = "gold_research.flow:main"
research = "quant_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_platform = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::pyparsing.warnings.PyparsingDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
