server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    proxy_ssl_server_name on;
    proxy_ssl_name quant.ai.jingtao.fun;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 2;

    # No directory listing — prevents scanning
    autoindex off;

    # Block root and any directory request — no enumeration
    location = / {
        return 404;
    }

    # QuantResearch stable URLs resolve from zhlearn's immutable result authority.
    location = /f642b386-74c0-4e9f-92e6-563e7c6a5d69.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass https://quant.ai.jingtao.fun/api/v1/production/stable-reports/f642b386-74c0-4e9f-92e6-563e7c6a5d69.html;
    }

    location = /8991e9a8-1caa-41f5-b76b-6368259db5b4.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass https://quant.ai.jingtao.fun/api/v1/production/stable-reports/8991e9a8-1caa-41f5-b76b-6368259db5b4.html;
    }

    # Whitelist file types only (UUID paths required)
    location ~* "^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(html|pdf|md|txt)$" {
        add_header Cache-Control "private, max-age=3600";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "no-referrer";
        try_files $uri =404;
    }

    # Everything else: 404 (no info leakage)
    location / {
        return 404;
    }

    # Don't serve hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
