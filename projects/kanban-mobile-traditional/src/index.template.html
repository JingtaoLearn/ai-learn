<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Kanban Pulse · 只读看板</title>
  <style>@@STYLE@@</style>
</head>
<body>
  <a class="skip-link" href="#task-list">跳到任务列表</a>
  <header class="topbar">
    <div>
      <p class="eyebrow">AGENTIC WORKFLOW</p>
      <h1>Kanban Pulse</h1>
    </div>
    <div class="read-only" aria-label="只读模式"><span aria-hidden="true">◉</span> 只读</div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-summary">
      <div>
        <p id="page-summary" class="lede">现在发生了什么，一眼看清。</p>
        <p class="snapshot-note" id="snapshot-note"></p>
      </div>
      <button class="icon-button" id="reset-button" type="button" aria-label="重置筛选">重置</button>
    </section>

    <section class="metrics" aria-label="状态概览">
      <button class="metric metric-live" type="button" data-quick-status="live">
        <span class="metric-label">进行中</span><strong id="metric-live">0</strong><small>含等待执行与复审</small>
      </button>
      <button class="metric metric-blocked" type="button" data-quick-status="blocked">
        <span class="metric-label">需关注</span><strong id="metric-blocked">0</strong><small>已阻塞</small>
      </button>
      <button class="metric metric-done" type="button" data-quick-status="done">
        <span class="metric-label">最近完成</span><strong id="metric-done">0</strong><small>当前快照</small>
      </button>
    </section>

    <section class="controls" aria-label="筛选任务">
      <div class="board-tabs" id="board-tabs" role="tablist" aria-label="选择看板"></div>
      <div class="filter-row">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">搜索任务</span>
          <input id="search-input" type="search" placeholder="搜索任务或 Agent" autocomplete="off">
        </label>
        <select id="status-select" aria-label="选择状态">
          <option value="all">全部状态</option>
          <option value="live">进行中</option>
          <option value="blocked">已阻塞</option>
          <option value="done">已完成</option>
        </select>
      </div>
    </section>

    <section class="list-head" aria-live="polite">
      <h2 id="list-title">全部任务</h2>
      <span id="result-count">0 项</span>
    </section>
    <section id="task-list" class="task-list" aria-label="任务列表"></section>
    <div class="empty" id="empty-state" hidden>
      <span aria-hidden="true">⌁</span>
      <h2>没有符合条件的任务</h2>
      <p>换一个看板、状态，或清空搜索词。</p>
    </div>
  </main>

  <dialog id="task-dialog" aria-labelledby="dialog-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <form method="dialog" class="dialog-head">
      <div><p class="eyebrow" id="dialog-board"></p><h2 id="dialog-title"></h2></div>
      <button class="close-button" value="close" aria-label="关闭详情">×</button>
    </form>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>

  <script id="snapshot-data" type="application/json">@@DATA@@</script>
  <script>@@SCRIPT@@</script>
</body>
</html>
