<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>抽奖</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff; user-select: none; -webkit-user-select: none;
}
#number {
  font-size: clamp(80px, 25vw, 180px); font-weight: 900;
  width: 280px; height: 280px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
  margin-bottom: 48px; transition: transform 0.3s; text-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
#number.spinning { animation: pulse 0.15s infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
#number.done { animation: pop 0.4s ease-out; background: rgba(255,255,255,0.25); }
@keyframes pop { 0% { transform: scale(1.2); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
button {
  font-size: 22px; font-weight: 700; padding: 18px 64px; border: none; border-radius: 50px;
  background: #fff; color: #764ba2; cursor: pointer; letter-spacing: 2px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2); transition: all 0.2s;
}
button:active { transform: scale(0.95); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="number">?</div>
<button id="btn" onclick="start()">开始抽奖</button>
<script>
const numEl = document.getElementById('number');
const btn = document.getElementById('btn');
let timer;

function start() {
  btn.disabled = true;
  numEl.className = 'spinning';
  const end = Date.now() + 5000;
  let interval = 50;

  function tick() {
    numEl.textContent = Math.floor(Math.random() * 38) + 1;
    const remaining = end - Date.now();
    if (remaining <= 0) {
      numEl.textContent = Math.floor(Math.random() * 38) + 1;
      numEl.className = 'done';
      btn.disabled = false;
      return;
    }
    // slow down in last 2 seconds
    if (remaining < 2000) interval = 100 + (2000 - remaining) / 5;
    setTimeout(tick, interval);
  }
  tick();
}
</script>
</body>
</html>
